<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <?!= HtmlService.createTemplateFromFile('Style').evaluate().getContent(); ?>
    <style>

            display: flex;

<body>
    <div class="main-content">
        <div id="instructions" class="instructions">
            Scanning Master Log folder for missing flights...<br>
            Please wait while missing flight candidates are detected.
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px; margin-bottom:4px;">
            <div class="instructions" style="font-weight:bold; margin:0;">Activity Log:</div>
            <button type="button" id="btn-copy-log" class="secondary" style="padding:2px 8px; font-size:11px;" onclick="copyConsoleLog()">📋 Copy Log</button>
        </div>
        <div id="log-console"></div>

        <!-- Action Buttons (Tri-Mode Execution Bar at bottom right above progress bar) -->
        <div class="control-group">
            <button type="button" id="btn-run-here" onclick="startResync('MODAL')" class="primary-action" style="display:none;">🚀 Run Here</button>
            <button type="button" id="btn-run-sidebar" onclick="startResync('SIDEBAR')" class="secondary" style="border-color:#1976D2; color:#1976D2; font-weight:600; display:none;">📌 Run in Sidebar</button>
            <button type="button" id="btn-run-background" onclick="startResync('BACKGROUND')" class="secondary" style="border-color:#5E35B1; color:#5E35B1; font-weight:600; display:none;">⚙️ Run in Background</button>
            <button type="button" id="btn-close" onclick="google.script.host.close()" class="secondary">Cancel</button>
        </div>
    </div>

    <div class="footer">
        <div class="status-line">
            <span id="status-left">Initializing...</span>
            <span id="status-right">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progress-bar" class="progress-bar-fill"></div>
        </div>
    </div>

    <script>
        var fileList = [];
        var folderName = 'Master Logs';
        var processedFiles = 0;
        var skippedFiles = 0;
        var errorFiles = 0;
        var totalFiles = 0;
        var isResyncing = false;

        window.onload = function () {
            setStatus('Scanning Master Log folder...', '0%');
            log('Scanning Master Log folder for missing flights...');

            google.script.run
                .withSuccessHandler(onDiscoveredFiles)
                .withFailureHandler(showError)
                .getMissingMasterLogsStatus();
        };

        function setActionButtonsVisible(visible, count) {
            var b1 = document.getElementById('btn-run-here');
            var b2 = document.getElementById('btn-run-sidebar');
            var b3 = document.getElementById('btn-run-background');
            var disp = visible ? 'inline-block' : 'none';
            if (b1) {
                b1.style.display = disp;
                b1.innerText = '🚀 Run Here (' + count + ')';
            }
            if (b2) b2.style.display = disp;
            if (b3) b3.style.display = disp;
        }

        function setActionButtonsEnabled(enabled) {
            var b1 = document.getElementById('btn-run-here');
            var b2 = document.getElementById('btn-run-sidebar');
            var b3 = document.getElementById('btn-run-background');
            if (b1) b1.disabled = !enabled;
            if (b2) b2.disabled = !enabled;
            if (b3) b3.disabled = !enabled;
        }

        function onDiscoveredFiles(result) {
            if (result.error) {
                showError(result.error);
                return;
            }

            folderName = result.folderName || 'Master Logs';
            fileList = result.files || [];
            totalFiles = fileList.length;

            if (totalFiles === 0) {
                log('Master Log Folder: ' + folderName);
                log('All flights in Master Logs are already logged in the Flights sheet.');
                log('No missing flights found.');
                setStatus('No missing flights found', '100%');
                setProgress('100%');
                document.getElementById('instructions').innerHTML = 'Master Log Folder: <strong>' + folderName + '</strong><br>All flights are already present in the Flights sheet.';
                setDoneButton();
            } else {
                log('Master Log Folder: ' + folderName);
                log('Found ' + totalFiles + ' missing flight file(s) in Master Logs.');
                log('Select a Tri-Mode execution option below:');

                setStatus('Found ' + totalFiles + ' missing flight(s)', '0%');
                document.getElementById('instructions').innerHTML = 'Master Log Folder: <strong>' + folderName + '</strong><br>Found <strong>' + totalFiles + ' missing flight file(s)</strong>. Select an execution mode to re-sync:';
                setActionButtonsVisible(true, totalFiles);
            }
        }

        function startResync(mode) {
            if (isResyncing || totalFiles === 0) return;

            // Mode 2: Run in Sidebar (DSGN-UI-001)
            if (mode === 'SIDEBAR') {
                var sidebarPayload = {
                    jobType: 'RESYNC',
                    title: 'Re-sync Master Logs',
                    contextText: folderName + ' (' + totalFiles + ' files)',
                    totalItems: totalFiles,
                    queue: fileList,
                    batchSize: 5,
                    options: {}
                };
                setActionButtonsEnabled(false);
                google.script.run
                    .withSuccessHandler(function() {
                        google.script.host.close();
                    })
                    .withFailureHandler(function(err) {
                        alert('Sidebar launch failed: ' + (err.message || err));
                        setActionButtonsEnabled(true);
                    })
                    .launchExecutionSidebar(sidebarPayload);
                return;
            }

            // Mode 3: Run in Background (DSGN-UI-001)
            if (mode === 'BACKGROUND') {
                var bgPayload = {
                    jobType: 'RESYNC',
                    title: 'Re-sync Master Logs',
                    contextText: folderName + ' (' + totalFiles + ' files)',
                    totalItems: totalFiles,
                    queue: fileList,
                    batchSize: 5,
                    options: {}
                };
                setActionButtonsEnabled(false);
                google.script.run
                    .withSuccessHandler(function() {
                        google.script.host.close();
                    })
                    .withFailureHandler(function(err) {
                        alert('Background launch failed: ' + (err.message || err));
                        setActionButtonsEnabled(true);
                    })
                    .launchBackgroundJob(bgPayload);
                return;
            }

            // Mode 1: Run Here (Modal)
            isResyncing = true;
            setActionButtonsVisible(false, 0);
            var btnClose = document.getElementById('btn-close');
            btnClose.innerText = 'Cancel';

            log('------------------------------------------------');
            log('Starting re-sync of ' + totalFiles + ' missing flight(s)...');
            google.script.run.logClientActivity('MASTER_RESYNC', '[START] Starting re-sync of ' + totalFiles + ' missing Master flight(s)');
            processNext(0);
        }

        function processNext(index) {
            if (index >= fileList.length) {
                finish();
                return;
            }

            var file = fileList[index];
            var pct = Math.round((index / fileList.length) * 100) + '%';
            var statusStr = (index + 1) + '/' + totalFiles + ' Files | ' + pct + ' | ' + file.name;
            setStatus(statusStr, pct);
            setProgress(pct);

            google.script.run
                .withSuccessHandler(function (res) {
                    if (res && res.success) {
                        var msg = file.name + ': ' + (res.msg || 'Restored (Review?)');
                        log(msg, 'log-success');
                        processedFiles++;
                    } else {
                        var errMsg = file.name + ': ' + (res ? res.error : 'Skipped');
                        if (res && res.error && res.error.indexOf('Skipped') !== -1) {
                            log(errMsg, 'log-info');
                            skippedFiles++;
                        } else {
                            log(errMsg, 'log-error');
                            errorFiles++;
                        }
                    }
                    processNext(index + 1);
                })
                .withFailureHandler(function (e) {
                    log(file.name + ': Fatal Error ' + e.message, 'log-error');
                    errorFiles++;
                    processNext(index + 1);
                })
                .restoreSingleMasterFlight(file.id);
        }

        function finish() {
            setProgress('100%');
            setStatus('Sorting logbook...', '95%');

            log('------------------------------------------------');
            log('Re-sync Complete.');
            log('Files Restored: ' + processedFiles);
            log('Skipped: ' + skippedFiles);
            log('Errors: ' + errorFiles);
            log('Sorting logbook chronologically and re-indexing flights...');

            google.script.run
                .withSuccessHandler(function() {
                    var statusStr = totalFiles + '/' + totalFiles + ' Files | 100% | Completed';
                    setStatus(statusStr, '100%');
                    log('Logbook sorted chronologically.');
                    log('=== Re-sync Complete ===');
                    setDoneButton();
                })
                .withFailureHandler(function(err) {
                    setStatus('Completed with Warnings', '100%');
                    log('Finalize warning: ' + err.message, 'log-error');
                    setDoneButton();
                })
                .finalizeResync({ restored: processedFiles, skipped: skippedFiles, errors: errorFiles });
        }

        function setDoneButton() {
            var btnClose = document.getElementById('btn-close');
            if (btnClose) {
                btnClose.innerText = 'Done';
                btnClose.className = 'primary-action';
                btnClose.disabled = false;
                btnClose.style.opacity = '1';
                btnClose.onclick = function() { google.script.host.close(); };
            }
        }

        function showError(msg) {
            setStatus('Error', 'Failed');
            log('Error: ' + msg, 'log-error');
            document.getElementById('progress-bar').classList.add('error-fill');
            var btnClose = document.getElementById('btn-close');
            btnClose.innerText = 'Close';
            btnClose.className = 'secondary';
            btnClose.disabled = false;
            btnClose.style.opacity = '1';
        }

        function setStatus(left, right) {
            document.getElementById('status-left').textContent = left;
            document.getElementById('status-right').textContent = right;
        }

        function setProgress(pct) {
            document.getElementById('progress-bar').style.width = pct;
        }

        function log(msg, cls) {
            var div = document.getElementById('log-console');
            var p = document.createElement('div');
            p.textContent = msg;
            if (cls) p.className = cls;
            div.appendChild(p);
            div.scrollTop = div.scrollHeight;
        }

        function copyConsoleLog() {
            var consoleEl = document.getElementById("log-console");
            if (!consoleEl) return;
            var text = consoleEl.innerText || consoleEl.textContent;
            navigator.clipboard.writeText(text).then(function() {
                var btn = document.getElementById("btn-copy-log");
                if (!btn) return;
                var origText = btn.innerText;
                btn.innerText = "✓ Copied!";
                btn.style.backgroundColor = "#2E7D32";
                btn.style.color = "#FFFFFF";
                setTimeout(function() {
                    btn.innerText = origText;
                    btn.style.backgroundColor = "";
                    btn.style.color = "";
                }, 2000);
            }).catch(function(err) {
                alert("Failed to copy log: " + err);
            });
        }
    </script>
</body>

</html>
