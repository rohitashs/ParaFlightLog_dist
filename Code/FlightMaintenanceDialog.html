<body>
    <div class="main-content">
        <div class="section-label">1. Target Scope</div>
        <div class="scope-card">
            <label class="radio-item">
                <input type="radio" name="scope" id="scope-selected" value="selected" checked onchange="onScopeChange()">
                <span>Selected Rows</span>
                <span id="badge-selected" class="badge">Detecting...</span>
            </label>
            <div id="desc-selected" class="scope-desc">Current row selection on Flights tab.</div>

            <label class="radio-item">
                <input type="radio" name="scope" id="scope-all" value="all" onchange="onScopeChange()">
                <span>All Flights</span>
                <span id="badge-all" class="badge">Detecting...</span>
            </label>
            <div id="desc-all" class="scope-desc">All flights currently in the Flights logbook.</div>
        </div>

        <div class="section-label">2. Operations to Perform</div>
        <div class="ops-card">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 4px 12px;">
                <label class="check-item">
                    <input type="checkbox" id="op-weather" checked>
                    <span><strong>Weather</strong> (Open-Meteo)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="op-geo" checked>
                    <span><strong>Geo & Sites</strong> (Launch/Landing)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="op-xcontest" checked>
                    <span><strong>XContest</strong> (Status check)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="op-physics" checked>
                    <span><strong>Physics</strong> (Thermals, Glide)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="op-scoring">
                    <span><strong>XC Scoring</strong> (Turnpoints, FAI)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="op-sort">
                    <span><strong>Sort by Date</strong> (Newest first)</span>
                </label>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
            <div class="section-label" style="margin:0;">Activity Log:</div>
            <button type="button" id="btn-copy-log" class="secondary" style="padding:2px 8px; font-size:11px;" onclick="copyConsoleLog()">📋 Copy Log</button>
        </div>
        <div id="log-console">Ready to apply updates. Select scope and operations above.</div>

        <!-- Action Buttons (Tri-Mode Execution Bar at bottom above progress bar) -->
        <div class="control-group">
            <button type="button" id="btn-run-here" onclick="startMaintenance('MODAL')" class="primary-action" disabled>🚀 Run Here</button>
            <button type="button" id="btn-run-sidebar" onclick="startMaintenance('SIDEBAR')" class="secondary" style="border-color:#1976D2; color:#1976D2; font-weight:600;" disabled>📌 Run in Sidebar</button>
            <button type="button" id="btn-run-background" onclick="startMaintenance('BACKGROUND')" class="secondary" style="border-color:#5E35B1; color:#5E35B1; font-weight:600;" disabled>⚙️ Run in Background</button>
            <button type="button" id="btn-cancel" class="secondary" onclick="google.script.host.close()">Cancel</button>
        </div>
    </div>

    <div class="footer">
        <div class="status-line">
            <span id="status-left">Idle</span>
            <span id="status-right">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progress-bar" class="progress-bar-fill"></div>
        </div>
    </div>

    <script>
        var scopeInfo = null;
        var targetRows = [];
        var currentIndex = 0;
        var isRunning = false;
        var opConfig = {};

        window.onload = function () {
            log('Detecting flight selection and total flights...');
            google.script.run
                .withSuccessHandler(initScopeUI)
                .withFailureHandler(function (err) {
                    log('Error detecting scope: ' + err.message);
                    setStatus('Error detecting scope', '0%');
                })
                .getMaintenanceScopeInfo();
        };

        function log(msg) {
            var c = document.getElementById('log-console');
            c.textContent += '\n' + msg;
            c.scrollTop = c.scrollHeight;
        }

        function setStatus(text, pctStr) {
            document.getElementById('status-left').innerText = text;
            document.getElementById('status-right').innerText = pctStr;
            var pct = parseInt(pctStr, 10) || 0;
            document.getElementById('progress-bar').style.width = pct + '%';
        }

        function copyConsoleLog() {
            var logEl = document.getElementById('log-console');
            var text = logEl.innerText || logEl.textContent;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    alert('Activity log copied to clipboard.');
                });
            } else {
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('Activity log copied to clipboard.');
            }
        }

        function setActionButtonsEnabled(enabled) {
            document.getElementById('btn-run-here').disabled = !enabled;
            document.getElementById('btn-run-sidebar').disabled = !enabled;
            document.getElementById('btn-run-background').disabled = !enabled;
        }

        function initScopeUI(info) {
            scopeInfo = info;
            var badgeSel = document.getElementById('badge-selected');
            var badgeAll = document.getElementById('badge-all');
            var rSel = document.getElementById('scope-selected');
            var rAll = document.getElementById('scope-all');

            badgeAll.innerText = info.totalFlights + ' flights';

            if (info.isFlightsSheet && info.selectedRowCount > 0) {
                badgeSel.innerText = info.selectedRowCount + ' selected (Rows ' + info.selectedRowRange + ')';
                badgeSel.className = 'badge';
                rSel.checked = true;
                rSel.disabled = false;
                setActionButtonsEnabled(true);
            } else {
                badgeSel.innerText = info.isFlightsSheet ? 'No flights in selection' : 'Not on Flights sheet';
                badgeSel.className = 'badge badge-warn';
                rAll.checked = true;
                rSel.disabled = true;
                setActionButtonsEnabled(info.totalFlights > 0);
            }

            if (info.totalFlights === 0) {
                badgeAll.className = 'badge badge-warn';
                if (!info.isFlightsSheet || info.selectedRowCount === 0) {
                    setActionButtonsEnabled(false);
                }
            } else {
                badgeAll.className = 'badge';
            }
            log('Logbook contains ' + info.totalFlights + ' flights.');
        }

        function onScopeChange() {
            var selectedScope = document.querySelector('input[name="scope"]:checked').value;
            if (selectedScope === 'selected' && (!scopeInfo || scopeInfo.selectedRowCount === 0)) {
                setActionButtonsEnabled(false);
            } else if (selectedScope === 'all' && (!scopeInfo || scopeInfo.totalFlights === 0)) {
                setActionButtonsEnabled(false);
            } else {
                setActionButtonsEnabled(true);
            }
        }

        function getSelectedOps() {
            return {
                weather: document.getElementById('op-weather').checked,
                geo: document.getElementById('op-geo').checked,
                xcontest: document.getElementById('op-xcontest').checked,
                physics: document.getElementById('op-physics').checked,
                scoring: document.getElementById('op-scoring').checked,
                sort: document.getElementById('op-sort').checked
            };
        }

        function startMaintenance(mode) {
            opConfig = getSelectedOps();
            var hasAnyOp = opConfig.weather || opConfig.geo || opConfig.xcontest || opConfig.physics || opConfig.scoring || opConfig.sort;
            if (!hasAnyOp) {
                alert('Please select at least one operation to perform.');
                return;
            }

            var selectedScope = document.querySelector('input[name="scope"]:checked').value;
            setActionButtonsEnabled(false);

            setStatus('Fetching flight rows...', '10%');
            log('Starting maintenance. Mode: ' + mode + ' | Scope: ' + selectedScope);
            google.script.run.logClientActivity('MAINTENANCE', '[START] Starting flight maintenance (' + selectedScope + ', ' + mode + ')');

            google.script.run
                .withSuccessHandler(function(rows) {
                    onRowsReceived(rows, mode, selectedScope);
                })
                .withFailureHandler(function (err) {
                    log('Failed to fetch flight rows: ' + err.message);
                    setActionButtonsEnabled(true);
                    finishProcess(false);
                })
                .getMaintenanceTargetRows(selectedScope);
        }

        function onRowsReceived(rows, mode, selectedScope) {
            targetRows = rows || [];
            if (targetRows.length === 0) {
                if (opConfig.sort) {
                    runSortStep();
                    return;
                }
                log('No flight rows to process.');
                finishProcess(true);
                return;
            }

            log('Found ' + targetRows.length + ' flights to process.');

            // Mode 2: Run in Sidebar (DSGN-UI-001)
            if (mode === 'SIDEBAR') {
                var sidebarPayload = {
                    jobType: 'MAINTENANCE',
                    title: 'Flight Maintenance',
                    contextText: (selectedScope === 'selected' ? 'Selected Rows (' : 'All Flights (') + targetRows.length + ')',
                    totalItems: targetRows.length,
                    queue: targetRows,
                    batchSize: 5,
                    options: opConfig
                };
                google.script.run
                    .withSuccessHandler(function() {
                        google.script.host.close();
                    })
                    .withFailureHandler(function(err) {
                        alert('Sidebar launch failed: ' + err.message);
                        setActionButtonsEnabled(true);
                    })
                    .launchExecutionSidebar(sidebarPayload);
                return;
            }

            // Mode 3: Run in Background (DSGN-UI-001)
            if (mode === 'BACKGROUND') {
                var bgPayload = {
                    jobType: 'MAINTENANCE',
                    title: 'Flight Maintenance',
                    contextText: (selectedScope === 'selected' ? 'Selected Rows (' : 'All Flights (') + targetRows.length + ')',
                    totalItems: targetRows.length,
                    queue: targetRows,
                    batchSize: 5,
                    options: opConfig
                };
                google.script.run
                    .withSuccessHandler(function() {
                        google.script.host.close();
                    })
                    .withFailureHandler(function(err) {
                        alert('Background launch failed: ' + err.message);
                        setActionButtonsEnabled(true);
                    })
                    .launchBackgroundJob(bgPayload);
                return;
            }

            // Mode 1: Run Here (Modal)
            isRunning = true;
            document.getElementById('btn-cancel').innerText = 'Cancel';
            currentIndex = 0;
            processNextRow();
        }

        function processNextRow() {
            if (!isRunning) return;

            if (currentIndex >= targetRows.length) {
                if (opConfig.sort) {
                    runSortStep();
                } else {
                    finishProcess(true);
                }
                return;
            }

            var item = targetRows[currentIndex];
            var pct = Math.round(((currentIndex) / targetRows.length) * 100);
            setStatus('Flight ' + (currentIndex + 1) + ' of ' + targetRows.length + ' (' + item.id + ')', pct + '%');

            google.script.run
                .withSuccessHandler(function (res) {
                    if (res && res.updated && res.updated.length > 0) {
                        log('Row ' + item.row + ' (' + item.id + '): Updated ' + res.updated.join(', '));
                    } else if (res && res.notes) {
                        log('Row ' + item.row + ' (' + item.id + '): ' + res.notes);
                    } else {
                        log('Row ' + item.row + ' (' + item.id + '): Up to date');
                    }
                    currentIndex++;
                    processNextRow();
                })
                .withFailureHandler(function (err) {
                    log('Row ' + item.row + ' (' + item.id + ') ERROR: ' + err.message);
                    currentIndex++;
                    processNextRow();
                })
                .executeFlightMaintenanceRow(item.row, opConfig);
        }

        function runSortStep() {
            setStatus('Sorting all flights by date...', '95%');
            log('Sorting logbook chronologically by Date (descending)...');
            google.script.run
                .withSuccessHandler(function () {
                    log('Logbook sorted successfully.');
                    finishProcess(true);
                })
                .withFailureHandler(function (err) {
                    log('Sort error: ' + err.message);
                    finishProcess(false);
                })
                .sortFlightsByDate();
        }

        function finishProcess(success) {
            isRunning = false;
            setStatus(success ? 'Completed' : 'Finished with warnings', '100%');
            document.getElementById('btn-run-here').style.display = 'none';
            document.getElementById('btn-run-sidebar').style.display = 'none';
            document.getElementById('btn-run-background').style.display = 'none';
            var btnClose = document.getElementById('btn-cancel');
            btnClose.innerText = 'Done';
            btnClose.className = 'primary-action';
            google.script.run.logClientActivity('MAINTENANCE', '[COMPLETE] Flight maintenance complete: ' + targetRows.length + ' flight(s) processed');
            log('=== Updates Complete ===');
        }
    </script>
</body>

</html>
