<body>
    <div class="main-content">
        <div class="instructions">
            Select a configuration file (<strong>.json</strong>) from your computer to inspect and apply settings.
        </div>

        <div class="file-upload-box">
            <input type="file" id="cfg-file" accept=".json" onchange="onFileSelected(this)">
        </div>

        <!-- Section Picker (Appears after file parsed) -->
        <div id="section-container" style="display:none;">
            <div class="instructions" style="font-weight:bold; margin-bottom:8px;">Available Configuration Sections:</div>

            <div id="card-profile" class="section-box">
                <label id="lbl-profile" class="check-item">
                    <input type="checkbox" id="chk-load-profile" checked>
                    <span><strong>Pilot Profile</strong> (Identity, Licensing, SAR, Tracking)</span>
                    <span id="badge-load-profile" class="badge-count">0 fields</span>
                </label>
            </div>

            <div id="card-params" class="section-box">
                <label id="lbl-params" class="check-item">
                    <input type="checkbox" id="chk-load-params" checked onchange="toggleLoadParamSubgroups()">
                    <span><strong>System Parameters</strong></span>
                    <span id="badge-load-params" class="badge-count">0 keys</span>
                </label>
                <div id="load-param-subgroups" class="sub-group">
                    <label id="lbl-sub-ingestion" class="check-item">
                        <input type="checkbox" id="load-sub-ingestion" checked onchange="onLoadSubParamChange()">
                        <span>Ingestion and Folders</span>
                        <span id="badge-sub-ingestion" class="badge-count">0 keys</span>
                    </label>
                    <label id="lbl-sub-integrations" class="check-item">
                        <input type="checkbox" id="load-sub-integrations" checked onchange="onLoadSubParamChange()">
                        <span>Integrations (Weather, XContest, Elevation, Geo)</span>
                        <span id="badge-sub-integrations" class="badge-count">0 keys</span>
                    </label>
                    <label id="lbl-sub-scoring" class="check-item">
                        <input type="checkbox" id="load-sub-scoring" checked onchange="onLoadSubParamChange()">
                        <span>Flight Scoring, Physics and Analysis</span>
                        <span id="badge-sub-scoring" class="badge-count">0 keys</span>
                    </label>
                    <label id="lbl-sub-format" class="check-item">
                        <input type="checkbox" id="load-sub-format" checked onchange="onLoadSubParamChange()">
                        <span>Formats and Units</span>
                        <span id="badge-sub-format" class="badge-count">0 keys</span>
                    </label>
                    <label id="lbl-sub-ui" class="check-item">
                        <input type="checkbox" id="load-sub-ui" checked onchange="onLoadSubParamChange()">
                        <span>UI (dashboard etc)</span>
                        <span id="badge-sub-ui" class="badge-count">0 keys</span>
                    </label>
                </div>
            </div>

            <div id="card-lookups" class="section-box">
                <label id="lbl-lookups" class="check-item">
                    <input type="checkbox" id="chk-load-lookups" checked>
                    <span><strong>Lookups</strong> (Equipment Categories, Status, Types, XC Classes, Formats)</span>
                    <span id="badge-load-lookups" class="badge-count">0 lists</span>
                </label>
            </div>
        </div>

        <!-- Buttons -->
        <div class="control-group">
            <button id="btn-apply" onclick="applyConfig()" class="action" style="display:none;">Apply Selected Configuration</button>
            <button id="btn-close" onclick="google.script.host.close()" class="secondary">Cancel</button>
        </div>

        <div class="instructions" style="margin-top:10px; font-weight:bold;">Activity Log:</div>
        <div id="log-console">Select a .json configuration file above to begin.</div>
    </div>

    <div class="footer">
        <div class="status-line">
            <span id="status-left">Idle</span>
            <span id="status-right">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progress-bar" class="progress-bar-fill"></div>
        </div>
    </div>

    <script>
        var parsedConfig = null;

        function classifyParamKey(k, groupHint) {
            var s = String(groupHint || '').trim();
            if (s === 'Ingestion' || s === 'Ingestion and Folders' || k.indexOf('FOLDER') !== -1 || k.indexOf('WATCH') !== -1) {
                return 'ingestion';
            }
            if (s === 'Integrations' || s === 'Geo & Time' || k.indexOf('WEATHER') !== -1 || k.indexOf('GEO_') !== -1 || k.indexOf('XCONTEST') !== -1 || k === 'CONTACT_EMAIL') {
                return 'integrations';
            }
            if (s === 'Scoring' || s === 'Flight Scoring, Physics and Analysis' || s === 'Validation' || s === 'Analysis Rules' || s === 'Analysis - Adv' || k.indexOf('VALIDATION') !== -1 || k.indexOf('THERMAL') !== -1 || k.indexOf('SOAR') !== -1 || k.indexOf('GLIDE') !== -1 || k.indexOf('SINK') !== -1 || k.indexOf('BONUS') !== -1) {
                return 'scoring';
            }
            if (s === 'Formats and Units' || s === 'Format and Units' || s === 'Lists' || k === 'DATE_FORMAT' || k === 'TIME_FORMAT') {
                return 'format';
            }
            if (s === 'UI (dashboard etc)' || s === 'UI' || s === 'Dashboard & Currency' || k.indexOf('TIMELINE') !== -1) {
                return 'ui';
            }
            return 'integrations';
        }

        function setElementState(chkId, lblId, badgeId, count, unit) {
            var chk = document.getElementById(chkId);
            var lbl = document.getElementById(lblId);
            var badge = document.getElementById(badgeId);
            if (badge) {
                badge.innerText = count + ' ' + unit;
            }
            if (count > 0) {
                chk.disabled = false;
                chk.checked = true;
                if (lbl) lbl.classList.remove('disabled');
                if (badge) badge.classList.remove('disabled-badge');
            } else {
                chk.disabled = true;
                chk.checked = false;
                if (lbl) lbl.classList.add('disabled');
                if (badge) badge.classList.add('disabled-badge');
            }
        }

        function onFileSelected(input) {
            var file = input.files[0];
            if (!file) return;

            log('Reading ' + file.name + ' (' + Math.round(file.size / 1024) + ' KB)...');
            setStatus('Parsing configuration file...', '20%');
            setProgress('20%');

            var reader = new FileReader();
            reader.onload = function (e) {
                try {
                    parsedConfig = JSON.parse(e.target.result);
                    inspectConfig(parsedConfig, file.name);
                } catch (err) {
                    showError('Failed to parse JSON file: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function inspectConfig(cfg, fileName) {
            var sections = cfg.sections || cfg;
            
            // 1. Profile count
            var pCount = (sections.pilotProfile && typeof sections.pilotProfile === 'object') ? Object.keys(sections.pilotProfile).length : 0;
            setElementState('chk-load-profile', 'lbl-profile', 'badge-load-profile', pCount, 'fields');

            // 2. Parameters count
            var paramCounts = { ingestion: 0, integrations: 0, scoring: 0, format: 0, ui: 0 };
            if (sections.parameters && typeof sections.parameters === 'object') {
                Object.keys(sections.parameters).forEach(function (k) {
                    var val = sections.parameters[k];
                    if (typeof val === 'object' && val !== null) {
                        Object.keys(val).forEach(function (subKey) {
                            var g = classifyParamKey(subKey, k);
                            if (paramCounts[g] !== undefined) paramCounts[g]++;
                        });
                    } else {
                        var g = classifyParamKey(k, '');
                        if (paramCounts[g] !== undefined) paramCounts[g]++;
                    }
                });
            }
            var totalParamKeys = paramCounts.ingestion + paramCounts.integrations + paramCounts.scoring + paramCounts.format + paramCounts.ui;
            setElementState('chk-load-params', 'lbl-params', 'badge-load-params', totalParamKeys, 'keys');
            setElementState('load-sub-ingestion', 'lbl-sub-ingestion', 'badge-sub-ingestion', paramCounts.ingestion, 'keys');
            setElementState('load-sub-integrations', 'lbl-sub-integrations', 'badge-sub-integrations', paramCounts.integrations, 'keys');
            setElementState('load-sub-scoring', 'lbl-sub-scoring', 'badge-sub-scoring', paramCounts.scoring, 'keys');
            setElementState('load-sub-format', 'lbl-sub-format', 'badge-sub-format', paramCounts.format, 'keys');
            setElementState('load-sub-ui', 'lbl-sub-ui', 'badge-sub-ui', paramCounts.ui, 'keys');

            // 3. Lookups count
            var lCount = (sections.lookups && typeof sections.lookups === 'object') ? Object.keys(sections.lookups).length : 0;
            setElementState('chk-load-lookups', 'lbl-lookups', 'badge-load-lookups', lCount, 'lists');

            if (pCount === 0 && totalParamKeys === 0 && lCount === 0) {
                showError('File does not contain valid Paragliding Flight Log configuration sections.');
                document.getElementById('section-container').style.display = 'none';
                document.getElementById('btn-apply').style.display = 'none';
                return;
            }

            document.getElementById('section-container').style.display = 'block';
            setStatus('File parsed successfully', '50%');
            setProgress('50%');
            log('Detected configuration from ' + fileName + ':');
            if (pCount > 0) log(' - Pilot Profile: ' + pCount + ' fields found.');
            if (totalParamKeys > 0) log(' - Parameters: ' + totalParamKeys + ' keys found across groups.');
            if (lCount > 0) log(' - Lookups: ' + lCount + ' controlled lists found.');
            log('Review your selections above and click "Apply Selected Configuration".');

            var btnApply = document.getElementById('btn-apply');
            btnApply.style.display = 'inline-block';
            setTimeout(function() {
                if (btnApply && btnApply.scrollIntoView) {
                    btnApply.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 100);
        }

        function toggleLoadParamSubgroups() {
            var checked = document.getElementById('chk-load-params').checked;
            ['ingestion', 'integrations', 'scoring', 'format', 'ui'].forEach(function (g) {
                var chk = document.getElementById('load-sub-' + g);
                if (!chk.disabled) {
                    chk.checked = checked;
                }
            });
        }

        function onLoadSubParamChange() {
            var anyChecked = ['ingestion', 'integrations', 'scoring', 'format', 'ui'].some(function (g) {
                var chk = document.getElementById('load-sub-' + g);
                return !chk.disabled && chk.checked;
            });
            document.getElementById('chk-load-params').checked = anyChecked;
        }

        function applyConfig() {
            if (!parsedConfig) return;

            var selectedOptions = {
                pilotProfile: !document.getElementById('chk-load-profile').disabled && document.getElementById('chk-load-profile').checked,
                parameters: !document.getElementById('chk-load-params').disabled && document.getElementById('chk-load-params').checked,
                paramGroups: {
                    ingestion: !document.getElementById('load-sub-ingestion').disabled && document.getElementById('load-sub-ingestion').checked,
                    integrations: !document.getElementById('load-sub-integrations').disabled && document.getElementById('load-sub-integrations').checked,
                    scoring: !document.getElementById('load-sub-scoring').disabled && document.getElementById('load-sub-scoring').checked,
                    format: !document.getElementById('load-sub-format').disabled && document.getElementById('load-sub-format').checked,
                    ui: !document.getElementById('load-sub-ui').disabled && document.getElementById('load-sub-ui').checked
                },
                lookups: !document.getElementById('chk-load-lookups').disabled && document.getElementById('chk-load-lookups').checked
            };

            if (!selectedOptions.pilotProfile && !selectedOptions.parameters && !selectedOptions.lookups) {
                alert('Please select at least one configuration component to apply.');
                return;
            }

            document.getElementById('btn-apply').disabled = true;
            setStatus('Applying configuration to spreadsheet...', '75%');
            setProgress('75%');
            log('------------------------------------------------');
            log('Writing configuration to Pilot_Profile and Config sheets...');

            google.script.run
                .withSuccessHandler(function (res) {
                    setProgress('100%');
                    if (res && res.success) {
                        setStatus('Configuration Applied | 100%', '100%');
                        log('Configuration imported successfully:', 'log-success');
                        if (res.profileUpdated) log(' - Pilot Profile: ' + res.profileUpdated + ' fields updated', 'log-success');
                        if (res.paramsUpdated) log(' - Parameters: ' + res.paramsUpdated + ' keys updated', 'log-success');
                        if (res.lookupsUpdated) log(' - Lookups: ' + res.lookupsUpdated + ' lists refreshed', 'log-success');
                        log('=== Configuration Applied ===');
                        document.getElementById('btn-apply').style.display = 'none';
                        setDoneButton();
                    } else {
                        showError(res ? res.error : 'Failed to apply configuration.');
                    }
                })
                .withFailureHandler(function (err) {
                    showError(err.message);
                })
                .importConfigJson(parsedConfig, selectedOptions);
        }

        function setDoneButton() {
            var btnClose = document.getElementById('btn-close');
            btnClose.innerText = 'Done';
            btnClose.className = 'action';
            btnClose.onclick = function () { google.script.host.close(); };
        }

        function showError(msg) {
            setStatus('Error', 'Failed');
            log('Error: ' + msg, 'log-error');
            document.getElementById('progress-bar').classList.add('error-fill');
            document.getElementById('btn-apply').disabled = false;
        }

        function setStatus(left, right) {
            document.getElementById('status-left').textContent = left;
            document.getElementById('status-right').textContent = right;
        }

        function setProgress(pct) {
            document.getElementById('progress-bar').style.width = pct;
        }

        function log(msg, cls) {
            var div = document.getElementById('log-console');
            var p = document.createElement('div');
            p.textContent = msg;
            if (cls) p.className = cls;
            div.appendChild(p);
            div.scrollTop = div.scrollHeight;
        }
    </script>
</body>
