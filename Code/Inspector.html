<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
  <style>
    body {
      padding: 10px;
      font-family: sans-serif;
      background-color: #f5f5f5;
      padding-bottom: 60px;
    }

    /* Section Headers */
    .section-header {
      padding: 8px 10px;
      margin-top: 10px;
      margin-bottom: 5px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      user-select: none;
    }

    .section-header:hover {
      opacity: 0.9;
    }

    .section-content {
      padding: 8px;
      background: white;
      border-radius: 4px;
      margin-bottom: 5px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      /* 6-Column Grid for flexibility */
      gap: 10px;
      transition: max-height 0.3s ease-out;
      overflow: hidden;
    }

    /* Fields */
    .field-container {
      margin-bottom: 2px;
      display: flex;
      flex-direction: column;
      grid-column: span 3;
      /* Default: Half width (3/6) */
    }

    /* Full width */
    .field-full {
      grid-column: span 6;
      /* Full width (6/6) */
    }

    /* Third width */
    .field-third {
      grid-column: span 2;
      /* Third width (2/6) */
    }

    .field-label {
      font-size: 10px;
      color: #666;
      margin-bottom: 2px;
      white-space: normal;
      /* Wrap text */
      overflow: hidden;
    }

    /* Bold label if editable */
    .field-label.editable-label {
      font-weight: bold;
      color: #333;
    }

    .value {
      font-weight: 500;
      color: #2c3e50;
      white-space: pre-wrap;
      /* Wrap long text */
      word-break: break-word;
    }

    .field-value {
      width: 100%;
      box-sizing: border-box;
      padding: 3px;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-size: 11px;
      white-space: normal;
      /* Wrap text in inputs uses textarea? No, inputs dont wrap. Divs do. */
    }

    textarea.field-value {
      resize: vertical;
      min-height: 40px;
      font-family: sans-serif;
    }

    .field-value:focus {
      border-color: #4d90fe;
      outline: none;
    }

    /* Read-only styling */
    .field-value[readonly],
    .field-value[disabled] {
      background-color: #f9f9f9;
      color: #555;
      border-color: #eee;
      font-weight: normal;
      /* Values not bold */
    }

    /* Footer */
    .sticky-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.05);
      z-index: 100;
    }

    .status-msg {
      font-size: 11px;
      margin-left: 10px;
      flex-grow: 1;
      text-align: right;
      margin-right: 10px;
      color: #666;
    }

    #loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    #error-banner {
      background: #ffebee;
      color: #c62828;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 10px;
      display: none;
      font-size: 12px;
    }

    /* Links */
    a.flight-link {
      text-decoration: none;
      color: #1a73e8;
    }

    a.flight-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div id="error-banner"></div>
  <div id="loading">Loading...</div>
  <div id="sections-container"></div>

  <div class="sticky-footer">
    <button class="action" onclick="saveChanges(this)">Save</button>
    <span id="status" class="status-msg"></span>
    <button onclick="forceRefresh()">Refresh</button>
  </div>

  <script>
    var currentFlightId = null;
    var isDirty = false;
    var pollInterval = null;
    var lastDataStr = '';

    window.onload = function () {
      loadData();
      startPolling();
    };

    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(checkForUpdates, 2000);
    }

    function checkForUpdates() {
      if (isDirty) return;
      google.script.run
        .withSuccessHandler(function (dataStr) {
          if (!dataStr) return;
          if (dataStr !== lastDataStr) {
            processData(dataStr, true);
          }
        })
        .withFailureHandler(function (e) { console.log('Poll error', e); })
        .getInspectorData();
    }

    function forceRefresh() {
      if (isDirty) {
        if (!confirm('You have unsaved changes. Discard and refresh?')) return;
      }
      isDirty = false;
      loadData();
    }

    function loadData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('error-banner').style.display = 'none';
      google.script.run
        .withSuccessHandler(function (d) { processData(d, false); })
        .withFailureHandler(showError)
        .getInspectorData();
    }

    function processData(jsonString, quiet) {
      if (!quiet) document.getElementById('loading').style.display = 'none';

      if (!jsonString) {
        if (!quiet) showError('No data returned.');
        return;
      }

      var data;
      try {
        data = JSON.parse(jsonString);
      } catch (e) {
        if (!quiet) showError('JSON Parse Fail: ' + e.message);
        return;
      }

      if (data.error) {
        if (!quiet) showError(data.error);
        return;
      }

      lastDataStr = jsonString;
      currentFlightId = data.flightId;
      isDirty = false;

      renderForm(data);
    }

    function renderForm(data) {
      if (!data.groups) return;
      var container = document.getElementById('sections-container');
      container.innerHTML = '';

      data.groups.forEach(function (group) {
        // Header
        var header = document.createElement('div');
        header.className = 'section-header';
        header.style.backgroundColor = group.color || '#eee';
        // Add indicator
        header.innerHTML = '<span class="indicator">&#9654;</span> ' + group.name; // Default collapsed
        header.onclick = function () { toggleSection(this); };
        container.appendChild(header);

        // Content
        var content = document.createElement('div');
        content.className = 'section-content';
        content.setAttribute('data-collapsed-rows', group.collapsedRows || 1);
        content.setAttribute('data-full-height', 'false'); // State tracking

        group.fields.forEach(function (field, idx) {
          var div = document.createElement('div');
          div.className = 'field-container';
          div.setAttribute('data-index', idx);

          // Full width check
          if (['Notes', 'Observations', 'Val: Reason', 'Auto Summary'].indexOf(field.name) > -1) {
            div.classList.add('field-full');
          }

          // Third width check (Status, Flight No, FlightID)
          if (['FlightID', 'Status', 'Flight No'].indexOf(field.name) > -1) {
            div.classList.add('field-third');
          }

          var label = document.createElement('label');
          label.className = 'field-label';
          if (field.editable) label.classList.add('editable-label');
          label.innerText = field.name;

          var input;


          // Special Handling: FlightID Hyperlink
          if (field.name === 'FlightID' && data.flightUrl) {
            var a = document.createElement('a');
            a.href = data.flightUrl;
            a.innerText = field.value;
            a.target = '_blank';
            a.className = 'flight-link';

            var wrapper = document.createElement('div');
            wrapper.className = 'field-value';
            wrapper.style.border = 'none';
            wrapper.style.padding = '5px 0';
            wrapper.appendChild(a);

            input = wrapper;
          } else {
            input = createInput(field);
          }

          div.appendChild(label);
          div.appendChild(input);
          content.appendChild(div);
        });

        container.appendChild(content);

        // Apply Initial Collapse
        applyCollapseState(content, group.collapsedRows || 1);
      });
    }

    function createInput(field) {
      var input;
      // Checkbox Handling
      if (field.choices && field.choices.length === 2 && field.choices[0] === 'TRUE' && field.choices[1] === 'FALSE') {
        // It's a checkbox
        var chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.className = 'field-value';
        chk.checked = (field.value === true || field.value === 'TRUE' || field.value === 'Yes');
        input = chk;
      }
      else if (field.choices && field.choices.length > 0) {
        input = document.createElement('select');
        input.className = 'field-value';

        field.choices.forEach(function (c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.innerText = c;
          if (c == field.value) opt.selected = true;
          input.appendChild(opt);
        });

        // Allow custom/current value if not in list
        if (field.value && !field.choices.includes(field.value)) {
          var opt = document.createElement('option');
          opt.value = field.value;
          opt.innerText = field.value + ' (Current)';
          opt.selected = true;
          input.appendChild(opt);
        }
      } else if (['Notes', 'Observations', 'Val: Reason', 'Auto Summary'].indexOf(field.name) > -1) {
        input = document.createElement('textarea');
        input.className = 'field-value';
        input.value = field.value || '';
      } else {
        input = document.createElement('input');
        input.className = 'field-value';
        input.value = field.value || '';
      }

      input.setAttribute('data-col', field.colIndex);
      input.setAttribute('data-header', field.name);

      if (!field.editable) {
        input.disabled = true;
        input.readOnly = true;
        if (input.type !== 'checkbox') input.style.backgroundColor = '#f9f9f9';
      } else {
        input.onchange = function () {
          isDirty = true;
          document.getElementById('status').innerText = 'Unsaved changes...';
        };
      }
      return input;
    }

    function toggleSection(header) {
      var content = header.nextElementSibling;
      var isFull = content.getAttribute('data-full-height') === 'true';
      var rows = parseInt(content.getAttribute('data-collapsed-rows'), 10);
      var ind = header.querySelector('.indicator');

      if (isFull) {
        // Collapse
        applyCollapseState(content, rows);
        if (ind) ind.innerHTML = '&#9654;'; // Right (Collapsed)
      } else {
        // Expand
        content.style.maxHeight = 'none'; // Allow full height

        // Show all children
        var kids = content.children;
        for (var i = 0; i < kids.length; i++) {
          kids[i].style.display = 'flex';
        }
        content.setAttribute('data-full-height', 'true');
        if (ind) ind.innerHTML = '&#9660;'; // Down (Expanded)
      }
    }

    function applyCollapseState(content, collapsedRows) {
      var itemsToShow = collapsedRows * 2;
      var kids = content.children;

      for (var i = 0; i < kids.length; i++) {
        if (i < itemsToShow) {
          kids[i].style.display = 'flex';
        } else {
          kids[i].style.display = 'none';
        }
      }
      content.setAttribute('data-full-height', 'false');
    }

    function saveChanges(btn) {
      btn.disabled = true;
      btn.innerText = 'Saving...';
      document.getElementById('status').innerText = '';

      var updates = [];
      var inputs = document.querySelectorAll('.field-value');

      inputs.forEach(function (input) {
        if (input.tagName === 'DIV') return;
        if (!input.readOnly && !input.disabled) {
          var val = input.value;
          if (input.type === 'checkbox') {
            val = input.checked ? 'TRUE' : 'FALSE';
          }
          updates.push({
            colIndex: input.getAttribute('data-col'),
            value: val,
            header: input.getAttribute('data-header')
          });
        }
      });

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.innerText = 'Save';
          if (res && res.error) {
            alert('Error: ' + res.error);
          } else {
            document.getElementById('status').innerText = 'Saved!';
            document.getElementById('status').style.color = 'green';
            isDirty = false;
            setTimeout(function () { document.getElementById('status').innerText = ''; }, 3000);
            checkForUpdates();
          }
        })
        .withFailureHandler(function (e) {
          btn.disabled = false;
          btn.innerText = 'Save';
          alert('Save Error: ' + e.message);
        })
        .saveInspectorData(currentFlightId, updates);
    }

    function showError(msg) {
      var banner = document.getElementById('error-banner');
      banner.innerText = msg;
      banner.style.display = 'block';
    }
  </script>
</body>

</html>
