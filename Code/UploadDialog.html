<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <?!= HtmlService.createTemplateFromFile('Style').evaluate().getContent(); ?>
  <style>

<body>
  <div class="main-content">
    <div class="instructions">
      Select IGC, ZIP, or GZ files to upload.<br>
      Supported formats: <strong>.igc, .igx, .zip, .gz</strong>
    </div>

    <!-- Inputs Group -->
    <div id="input-group" style="margin-bottom:8px;">
      <input type="file" name="files" id="files" multiple accept=".igc,.igx,.zip,.gz" onchange="onFilesSelected()">
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px; margin-bottom:4px;">
      <div class="instructions" style="font-weight:bold; margin:0;">Activity Log:</div>
      <button type="button" id="btn-copy-log" class="secondary" style="padding:2px 8px; font-size:11px;" onclick="copyConsoleLog()">📋 Copy Log</button>
    </div>
    <div id="log-console">Select files above to begin.</div>

    <!-- Action Buttons (Tri-Mode Execution Bar at bottom right above progress bar) -->
    <div class="control-group">
      <button type="button" id="btn-run-here" onclick="startUpload('MODAL')" class="primary-action" disabled>🚀 Run Here</button>
      <button type="button" id="btn-run-sidebar" onclick="startUpload('SIDEBAR')" class="secondary" style="border-color:#1976D2; color:#1976D2; font-weight:600;" disabled>📌 Run in Sidebar</button>
      <button type="button" id="btn-run-background" onclick="startUpload('BACKGROUND')" class="secondary" style="border-color:#5E35B1; color:#5E35B1; font-weight:600;" disabled>⚙️ Run in Background</button>
      <button type="button" id="btn-done" onclick="google.script.host.close()" class="primary-action" style="display:none;">Done</button>
      <button type="button" id="btn-close" onclick="google.script.host.close()" class="secondary">Cancel</button>
    </div>
  </div>

  <div class="footer">
    <div class="status-line">
      <span id="status-left">Ready</span>
      <span id="status-right">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div id="progress-bar" class="progress-bar-fill"></div>
    </div>
  </div>

  <script>
    var uploadQueue = [];
    var processingQueue = [];

    var totalFlightsToProcess = 0;
    var processedFlights = 0;
    var errorFlights = 0;
    var skippedFlights = 0;
    var activeMode = 'MODAL';

    function setActionButtonsEnabled(enabled) {
      document.getElementById('btn-run-here').disabled = !enabled;
      document.getElementById('btn-run-sidebar').disabled = !enabled;
      document.getElementById('btn-run-background').disabled = !enabled;
    }

    function onFilesSelected() {
      var fileInput = document.getElementById('files');
      var count = fileInput.files ? fileInput.files.length : 0;
      if (count > 0) {
        setActionButtonsEnabled(true);
        setStatus(count + ' file(s) selected', '0%');
        log(count + ' file(s) selected. Choose a run mode below:');
      } else {
        setActionButtonsEnabled(false);
        setStatus('Ready', '0%');
      }
    }

    function startUpload(mode) {
      activeMode = mode || 'MODAL';
      var fileInput = document.getElementById('files');
      if (!fileInput.files || fileInput.files.length === 0) {
        alert('Please select at least one file.');
        return;
      }

      document.getElementById('input-group').style.display = 'none';
      document.getElementById('btn-run-here').style.display = 'none';
      document.getElementById('btn-run-sidebar').style.display = 'none';
      document.getElementById('btn-run-background').style.display = 'none';

      var btnClose = document.getElementById('btn-close');
      btnClose.innerText = 'Cancel';

      uploadQueue = Array.from(fileInput.files);
      processingQueue = [];
      processedFlights = 0;
      errorFlights = 0;
      skippedFlights = 0;

      log('Starting upload & staging of ' + uploadQueue.length + ' file(s)...');
      google.script.run.logClientActivity('FILE_UPLOAD', '[START] Starting upload of ' + uploadQueue.length + ' file(s) (Mode: ' + activeMode + ')');
      setStatus('Uploading files...', '0%');
      uploadNext(0);
    }

    function uploadNext(index) {
      if (index >= uploadQueue.length) {
        onUploadStaged();
        return;
      }

      var file = uploadQueue[index];
      var pct = Math.round((index / uploadQueue.length) * 50) + '%';
      var statusStr = (index + 1) + '/' + uploadQueue.length + ' Uploading: ' + file.name;

      setStatus(statusStr, pct);
      setProgress(pct);

      var reader = new FileReader();
      reader.onload = function (e) {
        var dataUrl = e.target.result;
        var base64 = dataUrl.split(',')[1];
        var payload = { name: file.name, type: file.type, data: base64 };

        google.script.run
          .withSuccessHandler(function (res) {
            if (res && res.success) {
              log(file.name + ': Staged (' + res.files.length + ' flights)', 'log-info');
              res.files.forEach(function (f) { processingQueue.push(f); });
            } else {
              log(file.name + ': Error Staging - ' + (res ? res.error : 'Unknown error'), 'log-error');
            }
            uploadNext(index + 1);
          })
          .withFailureHandler(function (err) {
            log(file.name + ': Fatal Upload Error: ' + err, 'log-error');
            uploadNext(index + 1);
          })
          .stageUpload(payload);
      };
      reader.readAsDataURL(file);
    }

    function onUploadStaged() {
      totalFlightsToProcess = processingQueue.length;
      if (totalFlightsToProcess === 0) {
        log('No valid flights found to process.', 'log-info');
        finish();
        return;
      }

      log('Upload complete. Discovered ' + totalFlightsToProcess + ' valid flight(s).');

      // Mode 2: Run in Sidebar (DSGN-UI-001)
      if (activeMode === 'SIDEBAR') {
        var sidebarPayload = {
          jobType: 'UPLOAD',
          title: 'Upload Flight Logs',
          contextText: uploadQueue.length + ' files (' + totalFlightsToProcess + ' flights)',
          totalItems: totalFlightsToProcess,
          queue: processingQueue,
          batchSize: 5,
          options: {}
        };
        google.script.run
          .withSuccessHandler(function() {
            google.script.host.close();
          })
          .withFailureHandler(function(err) {
            alert('Sidebar launch failed: ' + (err.message || err));
            finish();
          })
          .launchExecutionSidebar(sidebarPayload);
        return;
      }

      // Mode 3: Run in Background (DSGN-UI-001)
      if (activeMode === 'BACKGROUND') {
        var bgPayload = {
          jobType: 'UPLOAD',
          title: 'Upload Flight Logs',
          contextText: uploadQueue.length + ' files (' + totalFlightsToProcess + ' flights)',
          totalItems: totalFlightsToProcess,
          queue: processingQueue,
          batchSize: 5,
          options: {}
        };
        google.script.run
          .withSuccessHandler(function() {
            google.script.host.close();
          })
          .withFailureHandler(function(err) {
            alert('Background launch failed: ' + (err.message || err));
            finish();
          })
          .launchBackgroundJob(bgPayload);
        return;
      }

      // Mode 1: Run Here (Modal)
      log('------------------------------------------------');
      log('Processing ' + totalFlightsToProcess + ' Flight(s)...');
      processNext(0);
    }

    function processNext(index) {
      if (index >= totalFlightsToProcess) {
        finish();
        return;
      }

      var item = processingQueue[index];
      var basePct = 50;
      var stepPct = Math.round((index / totalFlightsToProcess) * 50);
      var totalPct = (basePct + stepPct) + '%';

      var statusStr = (index + 1) + '/' + totalFlightsToProcess + ' Flights | ' + totalPct + ' | ' + item.name;
      setStatus(statusStr, totalPct);
      setProgress(totalPct);

      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) {
            var msg = item.name + ': ' + (res.msg || 'Processed');
            log(msg, res.processed ? 'log-success' : 'log-info');
            if (res.processed) {
              processedFlights++;
            } else {
              skippedFiles++;
            }
          } else {
            log(item.name + ': Error ' + (res ? res.error : 'Failed'), 'log-error');
            errorFlights++;
          }
          processNext(index + 1);
        })
        .withFailureHandler(function (err) {
          log(item.name + ': Fatal Error ' + err, 'log-error');
          errorFlights++;
          processNext(index + 1);
        })
        .processFileById(item.id, 'UPLOAD');
    }

    function finish() {
      setProgress('100%');

      var statusStr = 'Completed | ' + processedFlights + ' Imported | ' + skippedFiles + ' Skipped | ' + errorFlights + ' Errors';
      setStatus(statusStr, '100%');

      log('------------------------------------------------');
      log('Upload & Ingest Complete.');
      log('Flights Imported: ' + processedFlights);
      log('Skipped: ' + skippedFiles);
      log('Errors: ' + errorFlights);
      google.script.run.logClientActivity('FILE_UPLOAD', '[COMPLETE] Upload complete: ' + processedFlights + ' imported, ' + skippedFiles + ' skipped, ' + errorFlights + ' errors');

      if (processedFlights > 0) {
        log('Sorting logbook chronologically (most recent flight first)...');
        google.script.run
          .withSuccessHandler(function() {
            log('Logbook sorted chronologically.');
          })
          .withFailureHandler(function(err) {
            console.warn('Auto-sort notice:', err);
          })
          .sortFlightsByDate();
      }

      document.getElementById('btn-close').style.display = 'none';
      document.getElementById('btn-done').style.display = 'inline-block';
    }

    function setStatus(left, right) {
      document.getElementById('status-left').textContent = left;
      document.getElementById('status-right').textContent = right;
    }

    function setProgress(pct) {
      document.getElementById('progress-bar').style.width = pct;
    }

    function log(msg, cls) {
      var div = document.getElementById('log-console');
      var p = document.createElement('div');
      p.textContent = msg;
      if (cls) p.className = cls;
      div.appendChild(p);
      div.scrollTop = div.scrollHeight;
    }

    function copyConsoleLog() {
      var consoleEl = document.getElementById('log-console');
      if (!consoleEl) return;
      var text = consoleEl.innerText || consoleEl.textContent;
      navigator.clipboard.writeText(text).then(function() {
        var btn = document.getElementById('btn-copy-log');
        if (!btn) return;
        var origText = btn.innerText;
        btn.innerText = '✓ Copied!';
        btn.style.backgroundColor = '#2E7D32';
        btn.style.color = '#FFFFFF';
        setTimeout(function() {
          btn.innerText = origText;
          btn.style.backgroundColor = '';
          btn.style.color = '';
        }, 2000);
      }).catch(function(err) {
        alert('Failed to copy log: ' + err);
      });
    }
  </script>
</body>

</html>
